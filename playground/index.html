<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapbuilder Playground</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: #f5f5f5;
        padding: 2rem;
      }
      h1 {
        font-size: 1.5rem;
        color: #333;
        margin-bottom: 1rem;
      }
      .amply-map-default {
        width: 100%;
        height: 600px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }
    </style>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCJawWBSKnvVJtCwsnZ40K1-qfCguPgokI"></script>
  </head>
  <body>
    <h1>Mapbuilder Playground</h1>

    <div amply-map="true" data-map-center-lng="-122.4194" class="amply-map-default" data-control-maptype="false" data-legend-enabled="true" data-legend-position="TOP_LEFT" data-control-zoom="true" data-tooltip-type="infowindow" data-map-zoom="12" data-tooltip-bg-color="#f4deb8" data-api-key="AIzaSyCJawWBSKnvVJtCwsnZ40K1-qfCguPgokI" data-tooltip-trigger="click" data-control-fullscreen="true" data-map-type="roadmap" data-tooltip-text-color="#000000" data-layer-transit="false" data-control-scale="true" data-map-center-lat="37.7749" data-control-streetview="true" data-tooltip-auto-open="true" data-layer-bicycling="false" data-tooltip-border-style="solid" data-layer-traffic="false">
      <div data-marker-color="#FF0000" data-type="marker" data-marker-lat="34.0549076" data-marker-lng="-118.24264299999999" data-marker-title="Los Angeles" data-marker-description="Los Angeles, CA, USA" data-marker-visible="true"></div>
      <div data-marker-color="#FF0000" data-type="marker" data-marker-lat="37.7749295" data-marker-lng="-122.41941550000001" data-marker-title="San Francisco" data-marker-description="San Francisco, CA, USA" data-marker-visible="true"></div>
      <div data-marker-color="#FF0000" data-type="marker" data-marker-lat="37.33874" data-marker-lng="-121.88525249999999" data-marker-title="San Jose" data-marker-description="San Jose, CA, USA" data-marker-visible="true"></div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
